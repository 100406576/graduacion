<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entradas de Graduación</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #0f2b4c;
      --blue:       #1d4ed8;
      --blue-light: #eff6ff;
      --bg:         #f1f5f9;
      --surface:    #ffffff;
      --border:     #cbd5e1;
      --text:       #0f172a;
      --muted:      #64748b;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding-bottom: 5rem;
    }

    nav {
      background: var(--navy);
      padding: 0.9rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    nav .logo { font-size: 1.25rem; }
    nav span {
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .page-wrap {
      max-width: 500px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    /* ── Ticket card ── */
    .ticket {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(15,43,76,0.10), 0 1px 4px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .ticket-accent {
      height: 5px;
      background: linear-gradient(90deg, var(--navy) 0%, var(--blue) 100%);
    }

    .ticket-body {
      padding: 1.75rem 1.5rem 1.5rem;
      text-align: center;
    }

    .ticket-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 0.6rem;
    }

    .ticket-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 1.25rem;
    }

    .separador {
      height: 1px;
      background: var(--border);
      margin: 0 -1.5rem 1.25rem;
    }

    .nombre-alumno {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.4rem, 5.5vw, 1.85rem);
      font-weight: bold;
      color: var(--text);
      margin-bottom: 1.1rem;
      word-break: break-word;
      line-height: 1.3;
    }

    .info-entradas {
      display: flex;
      justify-content: center;
      gap: 0.65rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .info-pill {
      background: var(--blue-light);
      color: var(--blue);
      border-radius: 20px;
      padding: 0.35rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .usada-badge {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.1rem;
      display: inline-block;
    }

    .qr-imagen {
      width: min(220px, 68vw);
      height: min(220px, 68vw);
      margin: 0 auto 1.25rem;
      display: block;
      border-radius: 6px;
    }

    .nota-conjunta {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      background: #fefce8;
      border-left: 3px solid #ca8a04;
      border-radius: 0 8px 8px 0;
      padding: 0.65rem 0.9rem;
      font-size: 0.83rem;
      color: #713f12;
      text-align: left;
      margin-bottom: 1.25rem;
    }
    .nota-conjunta .icono { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }

    .evento-info {
      font-size: 0.88rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .evento-info .linea {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    /* ── Botón imprimir ── */
    .btn-print-fixed {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 0.85rem 1rem;
      background: white;
      border-top: 1px solid var(--border);
      z-index: 100;
    }
    .btn-print {
      width: 100%;
      padding: 0.85rem;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-print:hover  { background: #1e40af; }
    .btn-print:active { transform: scale(0.98); }
    .print-hint {
      text-align: center;
      font-size: 0.73rem;
      color: var(--muted);
      margin-top: 0.4rem;
    }
    .espacio-boton { height: 86px; }

    @media (min-width: 576px) {
      .btn-print-fixed {
        position: static;
        background: transparent;
        border-top: none;
        padding: 0;
        margin-top: 1rem;
      }
      .espacio-boton { display: none; }
    }

    @media print {
      body { background: white; padding-bottom: 0; }
      nav, .btn-print-fixed, .espacio-boton, .no-print { display: none !important; }
      .ticket { box-shadow: none; }
    }
  </style>
</head>
<body>

<nav>
  <span class="logo">🎓</span>
  <span>Entradas de Graduación</span>
</nav>

<div class="page-wrap">
  <div id="contenido">
    <div style="text-align:center;padding:3rem 1rem;color:var(--muted)">
      <div style="width:36px;height:36px;border:3px solid var(--blue);border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem"></div>
      <p>Cargando tus entradas…</p>
    </div>
  </div>
  <div class="espacio-boton"></div>
</div>

<div class="btn-print-fixed no-print" id="btn-imprimir" style="display:none">
  <button class="btn-print" onclick="window.print()">🖨️ Imprimir / Guardar como PDF</button>
  <p class="print-hint">En el diálogo de impresión elige "Guardar como PDF" para guardarlo en el móvil.</p>
</div>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
  const token = window.location.pathname.split('/').pop();

  async function cargar() {
    const res = await fetch(`/api/entrada/${token}`);
    if (!res.ok) {
      document.getElementById('contenido').innerHTML =
        '<div style="background:#fef2f2;border:1px solid #fca5a5;color:#b91c1c;border-radius:10px;padding:1rem 1.25rem;text-align:center;font-size:0.9rem">Este enlace no es válido o ha expirado.</div>';
      return;
    }

    const d = await res.json();
    document.getElementById('contenido').innerHTML = `
      <div class="ticket">
        <div class="ticket-accent"></div>
        <div class="ticket-body">
          <div class="ticket-label">Graduación 2026</div>
          <div class="ticket-title">Acto de Graduación</div>
          <div class="separador"></div>
          <div class="nombre-alumno">${d.nombre} ${d.apellidos}</div>

          <div class="info-entradas">
            <span class="info-pill">🎓 ${d.num_entradas} ${d.num_entradas === 1 ? 'entrada' : 'entradas'}</span>
            <span class="info-pill">🍽️ ${d.num_caterings} ${d.num_caterings === 1 ? 'catering' : 'caterings'}</span>
          </div>

          ${d.usada ? '<div class="usada-badge">⚠ Esta entrada ya fue usada</div>' : ''}

          <img src="${d.qr}" class="qr-imagen" alt="Código QR">

          <div class="nota-conjunta">
            <span class="icono">⚠️</span>
            <span><strong>Entrada conjunta obligatoria</strong> — todos los invitados deben acceder al recinto al mismo tiempo.</span>
          </div>

          <div class="evento-info">
            <div class="linea">📅 <span>16 de junio de 2026 · 18:30 h</span></div>
            <div class="linea">📍 <span>Casa de la Cultura — Carranque</span></div>
          </div>
        </div>
      </div>
    `;

    document.getElementById('btn-imprimir').style.display = 'block';
  }

  cargar();
</script>
</body>
</html>
