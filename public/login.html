<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso — Graduación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #1a3c6b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      text-align: center;
    }
    .login-card h1 { font-size: 1.5rem; color: #1a3c6b; margin-bottom: 0.3rem; }
    .login-card .subtitulo { color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div style="font-size:3rem">🎓</div>
    <h1>Graduación 2026</h1>
    <p class="subtitulo">Panel de administración</p>

    <form method="POST" action="/login">
      <div class="mb-3 text-start">
        <label class="form-label fw-bold">Contraseña</label>
        <input
          type="password"
          name="password"
          class="form-control form-control-lg"
          placeholder="Introduce la contraseña"
          autofocus
          autocomplete="current-password"
        >
      </div>

      <div id="error-msg" class="alert alert-danger mb-3" style="display:none">
        Contraseña incorrecta. Inténtalo de nuevo.
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100">
        Entrar
      </button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      document.getElementById('error-msg').style.display = 'block';
    }
  </script>
</body>
</html>
