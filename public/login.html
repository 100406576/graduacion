<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso — Graduación 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2b4c 0%, #1d4ed8 100%);
      padding: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }

    .logo { font-size: 3rem; margin-bottom: 0.5rem; }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f2b4c;
      margin-bottom: 0.25rem;
    }

    .subtitulo {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 2rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 0.85rem;
      font-weight: 600;
      color: #0f2b4c;
      margin-bottom: 0.4rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 1.25rem;
    }
    input[type="password"]:focus { border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(29,78,216,0.12); }

    .error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: left;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.85rem;
      background: #1d4ed8;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button[type="submit"]:hover  { background: #1e40af; }
    button[type="submit"]:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎓</div>
    <h1>Graduación 2026</h1>
    <p class="subtitulo">Panel de administración</p>

    <form method="POST" action="/login">
      <label for="pwd">Contraseña</label>
      <input type="password" id="pwd" name="password"
        placeholder="Introduce la contraseña" autofocus autocomplete="current-password">

      <div id="error-msg" class="error" style="display:none">
        Contraseña incorrecta. Inténtalo de nuevo.
      </div>

      <button type="submit">Entrar</button>
    </form>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get('error')) {
      document.getElementById('error-msg').style.display = 'block';
    }
  </script>
</body>
</html>
