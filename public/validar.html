<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Validar Entrada — Graduación</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1b2a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #091523;
      text-align: center;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      border-bottom: 1px solid #1e3a5f;
      flex-shrink: 0;
    }

    /* ── VISTA ESCÁNER ── */
    #vista-scanner {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      gap: 0.75rem;
    }
    #vista-scanner p {
      color: #8899aa;
      font-size: 0.95rem;
      text-align: center;
    }
    #reader {
      width: 100%;
      max-width: min(380px, 90vw);
      border-radius: 14px;
      overflow: hidden;
      background: #111;
    }
    #reader > img, #reader select, #reader a, #reader span { display: none !important; }

    /* ── VISTA RESULTADO ── */
    #vista-resultado {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    #vista-resultado.visible { display: flex; }

    .res-ok    { background: #198754; }
    .res-error { background: #c0392b; }

    .res-icono  { font-size: 5rem; line-height: 1; margin-bottom: 1rem; }
    .res-estado { font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 0.75rem; }
    .res-nombre { font-size: 2rem; font-weight: 700; word-break: break-word; margin-bottom: 0.4rem; }
    .res-sub    { font-size: 1.2rem; opacity: 0.9; margin-bottom: 2.5rem; }

    .btn-nueva {
      background: white;
      color: #111;
      border: none;
      border-radius: 14px;
      padding: 1.1rem 0;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .btn-nueva:active { transform: scale(0.97); }
  </style>
</head>
<body>

<header>🎓 Control de Entrada — Graduación 2026</header>

<!-- Vista cámara -->
<div id="vista-scanner">
  <p>Apunta la cámara al código QR de la entrada</p>
  <div id="reader"></div>
</div>

<!-- Vista resultado -->
<div id="vista-resultado" role="alert" aria-live="assertive">
  <div class="res-icono"  id="res-icono"></div>
  <div class="res-estado" id="res-estado"></div>
  <div class="res-nombre" id="res-nombre"></div>
  <div class="res-sub"    id="res-sub"></div>
  <button class="btn-nueva" onclick="volver()">📷 Escanear siguiente entrada</button>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  let escaner = null;
  let procesando = false;

  async function iniciarEscaner() {
    procesando = false;
    document.getElementById('reader').innerHTML = '';

    escaner = new Html5Qrcode('reader');
    try {
      await escaner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onEscaneo,
        () => {}
      );
    } catch {
      document.getElementById('reader').innerHTML =
        '<p style="color:#f87171;padding:1.5rem;text-align:center">No se pudo acceder a la cámara.<br>Comprueba que has dado permiso.</p>';
    }
  }

  async function onEscaneo(texto) {
    if (procesando) return;
    procesando = true;

    try { await escaner.stop(); } catch (_) {}

    const res = await fetch('/api/validar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigo_qr: texto })
    });
    const datos = await res.json();

    // Ocultar escáner, mostrar resultado
    document.getElementById('vista-scanner').style.display = 'none';
    const vr = document.getElementById('vista-resultado');

    if (datos.ok) {
      vr.className = 'res-ok visible';
      document.getElementById('res-icono').textContent  = '✅';
      document.getElementById('res-estado').textContent = 'ENTRADA VÁLIDA';
      document.getElementById('res-nombre').textContent = datos.alumno;
      document.getElementById('res-sub').textContent    = `Entrada ${datos.numero} de ${datos.total}`;
    } else if (datos.motivo === 'ya_usada') {
      vr.className = 'res-error visible';
      document.getElementById('res-icono').textContent  = '❌';
      document.getElementById('res-estado').textContent = 'YA USADA';
      document.getElementById('res-nombre').textContent = datos.alumno || '';
      document.getElementById('res-sub').textContent    = `Escaneada a las ${datos.usada_en}`;
    } else {
      vr.className = 'res-error visible';
      document.getElementById('res-icono').textContent  = '❌';
      document.getElementById('res-estado').textContent = 'NO RECONOCIDO';
      document.getElementById('res-nombre').textContent = '';
      document.getElementById('res-sub').textContent    = 'Este QR no corresponde a ninguna entrada';
    }
  }

  function volver() {
    document.getElementById('vista-resultado').className = '';
    document.getElementById('vista-resultado').style.display = 'none';
    document.getElementById('vista-scanner').style.display = 'flex';
    iniciarEscaner();
  }

  iniciarEscaner();
</script>
</body>
</html>
