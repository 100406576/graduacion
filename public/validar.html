<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Validar Entrada — Graduación</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1b2a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #091523;
      text-align: center;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      border-bottom: 1px solid #1e3a5f;
      flex-shrink: 0;
    }

    /* ── VISTA CÁMARA ── */
    #vista-scanner {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem;
      position: relative;
    }
    #vista-scanner p { color: #8899aa; font-size: 0.9rem; }

    .camara-wrap {
      position: relative;
      width: 100%;
      max-width: min(380px, 90vw);
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 1;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Marco de escaneo */
    .marco {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .marco-box {
      width: 65%;
      aspect-ratio: 1;
      border: 3px solid rgba(255,255,255,0.7);
      border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.4);
    }
    .marco-box.detectado {
      border-color: #4ade80;
      transition: border-color 0.1s;
    }
    #canvas { display: none; }

    /* ── VISTA RESULTADO ── */
    #vista-resultado {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    #vista-resultado.visible { display: flex; }

    .res-ok    { background: #198754; }
    .res-error { background: #c0392b; }

    .res-icono  { font-size: 5rem; line-height: 1; margin-bottom: 1rem; }
    .res-estado { font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 0.75rem; }
    .res-nombre { font-size: 2rem; font-weight: 700; word-break: break-word; margin-bottom: 0.4rem; }
    .res-sub    { font-size: 1.2rem; opacity: 0.9; margin-bottom: 2.5rem; }

    .btn-nueva {
      background: white;
      color: #111;
      border: none;
      border-radius: 14px;
      padding: 1.1rem 0;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .btn-nueva:active { transform: scale(0.97); }

    #msg-error {
      color: #f87171;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<header>🎓 Control de Entrada — Graduación 2026</header>

<!-- Vista cámara -->
<div id="vista-scanner">
  <p>Apunta la cámara al código QR de la entrada</p>
  <div class="camara-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="marco"><div class="marco-box" id="marco-box"></div></div>
  </div>
  <div id="msg-error" style="display:none"></div>
</div>

<!-- Vista resultado -->
<div id="vista-resultado" role="alert" aria-live="assertive">
  <div class="res-icono"  id="res-icono"></div>
  <div class="res-estado" id="res-estado"></div>
  <div class="res-nombre" id="res-nombre"></div>
  <div class="res-sub"    id="res-sub"></div>
  <button class="btn-nueva" id="btn-siguiente">📷 Escanear siguiente entrada</button>
</div>

<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
  const video    = document.getElementById('video');
  const canvas   = document.getElementById('canvas');
  const ctx      = canvas.getContext('2d', { willReadFrequently: true });
  const marcoBox = document.getElementById('marco-box');

  let escaneando = false; // true = procesando fotogramas
  let rafId      = null;

  // ── Arrancar cámara ───────────────────────────────────
  async function iniciar() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      await video.play();
      escaneando = true;
      tick();
    } catch (err) {
      const msg = document.getElementById('msg-error');
      msg.style.display = 'block';
      msg.textContent = 'No se pudo acceder a la cámara. Comprueba que has dado permiso en el navegador.';
    }
  }

  // ── Bucle de lectura de fotogramas ────────────────────
  function tick() {
    if (!escaneando) return;

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);

      const imagen = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const codigo = jsQR(imagen.data, imagen.width, imagen.height, {
        inversionAttempts: 'dontInvert'
      });

      if (codigo) {
        escaneando = false;
        marcoBox.classList.add('detectado');
        setTimeout(() => marcoBox.classList.remove('detectado'), 300);
        validar(codigo.data);
        return;
      }
    }

    rafId = requestAnimationFrame(tick);
  }

  // ── Validar contra el servidor ────────────────────────
  async function validar(texto) {
    const res = await fetch('/api/validar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigo_qr: texto })
    });
    const datos = await res.json();

    document.getElementById('vista-scanner').style.display = 'none';
    const vr = document.getElementById('vista-resultado');

    if (datos.ok) {
      vr.className = 'res-ok visible';
      document.getElementById('res-icono').textContent  = '✅';
      document.getElementById('res-estado').textContent = 'ENTRADA VÁLIDA';
      document.getElementById('res-nombre').textContent = datos.alumno;
      document.getElementById('res-sub').textContent    = `${datos.num_entradas} entradas · ${datos.num_caterings} caterings`;
    } else if (datos.motivo === 'ya_usada') {
      vr.className = 'res-error visible';
      document.getElementById('res-icono').textContent  = '❌';
      document.getElementById('res-estado').textContent = 'YA USADA';
      document.getElementById('res-nombre').textContent = datos.alumno || '';
      document.getElementById('res-sub').textContent    = `Escaneada a las ${datos.usada_en}`;
    } else {
      vr.className = 'res-error visible';
      document.getElementById('res-icono').textContent  = '❌';
      document.getElementById('res-estado').textContent = 'NO RECONOCIDO';
      document.getElementById('res-nombre').textContent = '';
      document.getElementById('res-sub').textContent    = 'Este QR no corresponde a ninguna entrada';
    }
  }

  // ── Volver a escanear: recarga limpia ────────────────
  document.getElementById('btn-siguiente').addEventListener('click', () => {
    window.location.reload();
  });

  iniciar();
</script>
</body>
</html>
