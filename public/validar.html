<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Validar Entrada — Graduación</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1b2a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #091523;
      text-align: center;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #1e3a5f;
      flex-shrink: 0;
    }

    .instruccion {
      text-align: center;
      color: #8899aa;
      font-size: 0.9rem;
      padding: 0.6rem 1rem;
      flex-shrink: 0;
    }

    #reader-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0.5rem;
      min-height: 0;
    }

    #reader {
      width: 100%;
      max-width: min(400px, 90vw);
      border-radius: 14px;
      overflow: hidden;
      background: #111;
    }

    /* Oculta los elementos internos de html5-qrcode que quedan feos */
    #reader > img, #reader select, #reader a { display: none !important; }

    #resultado {
      display: none;
      position: fixed;
      inset: 0;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
      text-align: center;
      z-index: 10;
    }
    #resultado.visible { display: flex; }

    .resultado-ok    { background: #198754; }
    .resultado-error { background: #dc3545; }

    .resultado-icono { font-size: 4rem; margin-bottom: 1rem; }
    .resultado-estado { font-size: 1.6rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .resultado-nombre { font-size: 1.9rem; font-weight: 700; margin: 0.5rem 0; word-break: break-word; }
    .resultado-sub { font-size: 1.1rem; opacity: 0.9; }

    .btn-siguiente {
      margin-top: 2.5rem;
      background: white;
      color: #111;
      border: none;
      border-radius: 12px;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
    }
    .btn-siguiente:active { opacity: 0.85; }
  </style>
</head>
<body>

<header>🎓 Control de Entrada — Graduación</header>
<p class="instruccion">Apunta la cámara al código QR de la entrada</p>

<div id="reader-wrap">
  <div id="reader"></div>
</div>

<div id="resultado" role="alert" aria-live="assertive"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  let escaner = null;
  let procesando = false;

  function iniciarEscaner() {
    document.getElementById('resultado').className = '';
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('reader-wrap').style.display = 'flex';
    procesando = false;

    escaner = new Html5Qrcode('reader');
    escaner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 260 } },
      onEscaneo,
      () => {}
    ).catch(() => {
      document.getElementById('reader').innerHTML =
        '<p style="color:#f87171;padding:1.5rem;text-align:center">No se pudo acceder a la cámara.<br>Comprueba que has dado permiso.</p>';
    });
  }

  async function onEscaneo(texto) {
    if (procesando) return;
    procesando = true;

    try { await escaner.stop(); } catch (_) {}
    document.getElementById('reader-wrap').style.display = 'none';

    const res = await fetch('/api/validar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigo_qr: texto })
    });
    const datos = await res.json();

    const div = document.getElementById('resultado');

    if (datos.ok) {
      div.className = 'resultado-ok visible';
      div.innerHTML = `
        <div class="resultado-icono">✅</div>
        <div class="resultado-estado">ENTRADA VÁLIDA</div>
        <div class="resultado-nombre">${datos.alumno}</div>
        <div class="resultado-sub">Entrada ${datos.numero} de ${datos.total}</div>
        <button class="btn-siguiente" onclick="siguienteEntrada()">▶ Siguiente entrada</button>
      `;
    } else if (datos.motivo === 'ya_usada') {
      div.className = 'resultado-error visible';
      div.innerHTML = `
        <div class="resultado-icono">❌</div>
        <div class="resultado-estado">YA USADA</div>
        <div class="resultado-nombre">${datos.alumno || ''}</div>
        <div class="resultado-sub">Escaneada a las ${datos.usada_en}</div>
        <button class="btn-siguiente" onclick="siguienteEntrada()">▶ Siguiente entrada</button>
      `;
    } else {
      div.className = 'resultado-error visible';
      div.innerHTML = `
        <div class="resultado-icono">❌</div>
        <div class="resultado-estado">NO RECONOCIDO</div>
        <div class="resultado-sub">Este QR no corresponde a ninguna entrada</div>
        <button class="btn-siguiente" onclick="siguienteEntrada()">▶ Intentar de nuevo</button>
      `;
    }
  }

  function siguienteEntrada() {
    document.getElementById('reader').innerHTML = '';
    iniciarEscaner();
  }

  iniciarEscaner();
</script>
</body>
</html>
