<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Admin — Graduación 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --navy:       #0f2b4c;
      --blue:       #1d4ed8;
      --blue-light: #eff6ff;
      --bg:         #f1f5f9;
      --surface:    #ffffff;
      --border:     #cbd5e1;
      --text:       #0f172a;
      --muted:      #64748b;
    }

    body { background: #edf1f7; font-family: 'Inter', sans-serif; color: var(--text); }

    /* ── Navbar ── */
    .topbar {
      background: linear-gradient(135deg, #0b1f38 0%, #0f2b4c 60%, #1a3a6e 100%);
      box-shadow: 0 2px 16px rgba(0,0,0,0.22);
      padding: 0.6rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .topbar-brand {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .topbar-brand span { opacity: 0.6; font-weight: 400; }

    .topbar-actions {
      display: flex;
      align-items: stretch;
      gap: 0.4rem;
      width: 100%;
    }

    /* Botón Validar destacado */
    .btn-validar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: #fde68a;
      color: #78350f;
      border: none;
      border-radius: 10px;
      padding: 0.55rem 0.9rem;
      font-size: 0.9rem;
      font-weight: 800;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
      min-height: 44px;
      flex: 2;
      letter-spacing: 0.2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .btn-validar:hover { background: #fcd34d; color: #78350f; }
    .btn-validar:active { transform: scale(0.97); }

    .btn-top {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.85);
      border-radius: 8px;
      padding: 0.55rem 0.5rem;
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      min-height: 44px;
      flex: 1;
    }
    .btn-top:hover { border-color: rgba(255,255,255,0.65); color: #fff; background: rgba(255,255,255,0.07); }

    @media (min-width: 768px) {
      .topbar { flex-direction: row; align-items: center; padding: 0.6rem 1.25rem; gap: 0.75rem; }
      .topbar-brand { margin-right: auto; }
      .topbar-actions { width: auto; }
      .btn-validar { flex: none; min-height: unset; padding: 0.5rem 1.1rem; }
      .btn-top { flex: none; min-height: unset; padding: 0.4rem 0.75rem; font-size: 0.82rem; }
    }

    /* ── Contenido ── */
    .page { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .section-title { font-size: 0.85rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Botón añadir */
    .btn-add {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-add:hover { background: #1e40af; }

    /* ── Tabla escritorio ── */
    .tabla-wrap { background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.07); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead th { background: var(--navy); color: #fff; padding: 0.85rem 1rem; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.4px; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--blue-light); }
    td { padding: 0.85rem 1rem; vertical-align: middle; }
    td.nombre { font-weight: 600; }

    /* ── Cards móvil ── */
    .alumno-card {
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      margin-bottom: 0.75rem;
      overflow: hidden;
    }
    .alumno-card-body { padding: 1rem; }
    .alumno-nombre { font-size: 1.05rem; font-weight: 700; color: var(--text); }
    .alumno-badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0 0.9rem; }
    .alumno-actions { display: flex; gap: 0.5rem; }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center;
      border-radius: 20px; padding: 0.25rem 0.7rem;
      font-size: 0.78rem; font-weight: 600;
    }
    .badge-blue    { background: var(--blue-light); color: var(--blue); }
    .badge-amber   { background: #fffbeb; color: #92400e; }
    .badge-green   { background: #f0fdf4; color: #166534; }
    .badge-gray    { background: #f1f5f9; color: var(--muted); }

    /* ── Botones de acción (todos misma base) ── */
    .btn-action {
      flex: 1;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 9px;
      padding: 0.55rem 0.5rem;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: #334155;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      transition: background 0.12s, border-color 0.12s;
      white-space: nowrap;
      min-width: 0;
    }
    .btn-action:hover { background: #f1f5f9; border-color: #cbd5e1; color: #334155; }
    .btn-action:active { transform: scale(0.97); }

    /* Papelera: botón rojo compacto para la esquina de la card */
    .btn-borrar {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.45rem 0.55rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .btn-borrar:hover:not(:disabled)  { background: #dc2626; }
    .btn-borrar:active:not(:disabled) { transform: scale(0.95); }
    .btn-borrar:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Modal ── */
    .modal-content { border-radius: 16px; overflow: hidden; border: none; }
    .modal-header-custom { background: var(--navy); padding: 1.1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; }
    .modal-header-custom h5 { color: #fff; font-weight: 700; font-size: 1.05rem; margin: 0; }
    .modal-close { background: none; border: none; color: rgba(255,255,255,0.7); font-size: 1.3rem; cursor: pointer; line-height: 1; padding: 0; }
    .modal-close:hover { color: #fff; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.35rem; }
    .form-group input {
      width: 100%; padding: 0.7rem 0.9rem;
      font-size: 0.95rem; font-family: 'Inter', sans-serif;
      border: 1.5px solid var(--border); border-radius: 9px;
      outline: none; transition: border-color 0.2s;
      color: var(--text);
    }
    .form-group input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(29,78,216,0.1); }
    .form-hint { font-size: 0.78rem; color: var(--muted); margin-top: 0.25rem; }
    .form-error-inline { font-size: 0.78rem; color: #dc2626; margin-top: 0.25rem; display: none; }

    .modal-footer-custom { padding: 1rem 1.25rem; display: flex; gap: 0.6rem; background: #f8fafc; border-top: 1px solid var(--border); }
    .btn-cancel {
      flex: 1; padding: 0.7rem; background: #fff; color: var(--muted);
      border: 1.5px solid var(--border); border-radius: 9px;
      font-size: 0.95rem; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer;
      transition: border-color 0.15s;
    }
    .btn-cancel:hover { border-color: #94a3b8; }
    .btn-save {
      flex: 1; padding: 0.7rem; background: var(--blue); color: #fff;
      border: none; border-radius: 9px;
      font-size: 0.95rem; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-save:hover { background: #1e40af; }
    .btn-save:disabled { background: #93c5fd; cursor: not-allowed; }

    .modal-error { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; border-radius: 8px; padding: 0.6rem 0.9rem; font-size: 0.85rem; margin-bottom: 0.5rem; display: none; }

    /* ── Toast ── */
    #toast-copiado { position: fixed; bottom: 1.5rem; right: 1rem; left: 1rem; z-index: 9999; max-width: 300px; margin: 0 auto; }
    @media (min-width: 576px) { #toast-copiado { left: auto; } }

    /* ── Modal overlay ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1040; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: var(--surface); border-radius: 16px; width: 100%; max-width: 460px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.22); }
  </style>
</head>
<body>

<!-- Navbar -->
<div class="topbar">
  <span class="topbar-brand">🎓 Graduación <span>2026 · Admin</span></span>
  <div class="topbar-actions">
    <a href="/validar" target="_blank" class="btn-validar">📷 Abrir escáner</a>
    <button class="btn-top" onclick="exportar()">⬇ Exportar</button>
    <label class="btn-top" style="cursor:pointer; margin:0">
      ⬆ Importar<input type="file" id="inp-importar" accept=".json" style="display:none">
    </label>
    <form method="POST" action="/logout" style="margin:0">
      <button type="submit" class="btn-top">Salir</button>
    </form>
  </div>
</div>

<div class="page">
  <div class="section-header">
    <span class="section-title">Alumnos y entradas</span>
    <button class="btn-add" id="btn-abrir-modal">+ Añadir alumno</button>
  </div>

  <!-- Vista móvil: tarjetas -->
  <div id="lista-cards" class="d-md-none"></div>

  <!-- Vista escritorio: tabla -->
  <div class="tabla-wrap d-none d-md-block">
    <table>
      <thead>
        <tr>
          <th>Alumno</th>
          <th style="text-align:center">Entradas</th>
          <th style="text-align:center">Caterings</th>
          <th style="text-align:center">Estado</th>
          <th>Enlace familia</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cuerpo-tabla">
        <tr><td colspan="6" style="text-align:center;color:var(--muted);padding:2rem">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal añadir alumno -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-header-custom">
      <h5>Añadir alumno</h5>
      <button class="modal-close" id="btn-cerrar-modal">✕</button>
    </div>
    <div style="padding:1.25rem 1.25rem 0">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="inp-nombre" placeholder="Ej: Ana" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Apellidos</label>
        <input type="text" id="inp-apellidos" placeholder="Ej: García López" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Número de entradas</label>
        <input type="number" id="inp-entradas" min="1" max="20" value="3" inputmode="numeric">
        <p class="form-hint">Personas que asistirán a la graduación.</p>
      </div>
      <div class="form-group">
        <label>Número de caterings</label>
        <input type="number" id="inp-caterings" min="0" max="20" value="3" inputmode="numeric">
        <p class="form-hint">Personas que participarán en el catering.</p>
        <p class="form-error-inline" id="error-caterings">No puede ser mayor que el número de entradas.</p>
      </div>
      <div class="modal-error" id="error-modal"></div>
    </div>
    <div class="modal-footer-custom">
      <button class="btn-cancel" id="btn-cancelar">Cancelar</button>
      <button class="btn-save" id="btn-guardar">Guardar</button>
    </div>
  </div>
</div>

<!-- Toast copiado -->
<div id="toast-copiado" class="toast align-items-center text-bg-success border-0" role="alert">
  <div class="d-flex">
    <div class="toast-body">✓ Enlace copiado al portapapeles</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const BASE = window.location.origin;
  const toastEl = document.getElementById('toast-copiado');
  const toast = new bootstrap.Toast(toastEl, { delay: 2500 });

  // ── Modal ────────────────────────────────────────────
  const overlay = document.getElementById('modal-overlay');

  function abrirModal() { overlay.classList.add('open'); document.getElementById('inp-nombre').focus(); }
  function cerrarModal() {
    overlay.classList.remove('open');
    document.getElementById('inp-nombre').value    = '';
    document.getElementById('inp-apellidos').value = '';
    document.getElementById('inp-entradas').value  = '3';
    document.getElementById('inp-caterings').value = '3';
    document.getElementById('error-modal').style.display = 'none';
    document.getElementById('error-caterings').style.display = 'none';
    document.getElementById('btn-guardar').disabled = false;
  }

  document.getElementById('btn-abrir-modal').addEventListener('click', abrirModal);
  document.getElementById('btn-cerrar-modal').addEventListener('click', cerrarModal);
  document.getElementById('btn-cancelar').addEventListener('click', cerrarModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) cerrarModal(); });

  // ── Validación caterings en tiempo real ──────────────
  function validarCaterings() {
    const entradas = parseInt(document.getElementById('inp-entradas').value) || 0;
    const caterings = parseInt(document.getElementById('inp-caterings').value) || 0;
    const errEl = document.getElementById('error-caterings');
    const guardarEl = document.getElementById('btn-guardar');
    if (caterings > entradas) {
      errEl.style.display = 'block';
      guardarEl.disabled = true;
    } else {
      errEl.style.display = 'none';
      guardarEl.disabled = false;
    }
  }

  document.getElementById('inp-caterings').addEventListener('input', validarCaterings);
  document.getElementById('inp-entradas').addEventListener('input', () => {
    const max = parseInt(document.getElementById('inp-entradas').value) || 20;
    document.getElementById('inp-caterings').max = max;
    validarCaterings();
  });

  // ── Guardar alumno ────────────────────────────────────
  document.getElementById('btn-guardar').addEventListener('click', async () => {
    const nombre    = document.getElementById('inp-nombre').value.trim();
    const apellidos = document.getElementById('inp-apellidos').value.trim();
    const num       = parseInt(document.getElementById('inp-entradas').value);
    const cat       = parseInt(document.getElementById('inp-caterings').value) || 0;
    const errorDiv  = document.getElementById('error-modal');

    if (!nombre || !apellidos || !num || num < 1) {
      errorDiv.textContent = 'Por favor rellena todos los campos correctamente.';
      errorDiv.style.display = 'block'; return;
    }
    if (cat > num) {
      errorDiv.textContent = 'El número de caterings no puede superar al de entradas.';
      errorDiv.style.display = 'block'; return;
    }
    errorDiv.style.display = 'none';

    const res = await fetch('/api/alumnos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, apellidos, num_entradas: num, num_caterings: cat })
    });
    const data = await res.json();
    if (!res.ok) { errorDiv.textContent = data.error; errorDiv.style.display = 'block'; return; }

    cerrarModal();
    cargarAlumnos();
  });

  document.getElementById('modal-overlay').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-guardar').click();
    if (e.key === 'Escape') cerrarModal();
  });

  // ── Render ────────────────────────────────────────────
  function badgeEstado(usada) {
    return usada
      ? '<span class="badge badge-green">✓ Usada</span>'
      : '<span class="badge badge-gray">— Pendiente</span>';
  }

  function renderCards(alumnos) {
    const cont = document.getElementById('lista-cards');
    if (!alumnos.length) {
      cont.innerHTML = '<p style="text-align:center;color:var(--muted);padding:2rem 0">No hay alumnos todavía.<br>Pulsa <strong>"+ Añadir alumno"</strong> para empezar.</p>';
      return;
    }
    cont.innerHTML = alumnos.map(a => `
      <div class="alumno-card">
        <div class="alumno-card-body">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;margin-bottom:0.6rem">
            <div class="alumno-nombre" style="margin-bottom:0">${a.apellidos}, ${a.nombre}</div>
            <button class="btn-borrar btn-borrar" data-id="${a.id}" data-nombre="${a.nombre} ${a.apellidos}"
              ${a.usada ? 'disabled title="Entrada ya usada"' : ''}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
              </svg>
            </button>
          </div>
          <div class="alumno-badges">
            <span class="badge badge-blue">🎓 ${a.num_entradas} entradas</span>
            <span class="badge badge-amber">🍽️ ${a.num_caterings} caterings</span>
            ${badgeEstado(a.usada)}
          </div>
          <div class="alumno-actions">
            <button class="btn-action btn-copiar" data-url="${BASE}/entrada/${a.token}">📋 Copiar</button>
            <button class="btn-action btn-compartir-js" data-url="${BASE}/entrada/${a.token}" data-nombre="${a.nombre} ${a.apellidos}">📤 Compartir</button>
            <a href="${BASE}/entrada/${a.token}" target="_blank" class="btn-action">👁 Ver</a>
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderTabla(alumnos) {
    const tbody = document.getElementById('cuerpo-tabla');
    if (!alumnos.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:2rem">No hay alumnos todavía.</td></tr>';
      return;
    }
    tbody.innerHTML = alumnos.map(a => `
      <tr>
        <td class="nombre">${a.apellidos}, ${a.nombre}</td>
        <td style="text-align:center"><span class="badge badge-blue">${a.num_entradas}</span></td>
        <td style="text-align:center"><span class="badge badge-amber">${a.num_caterings}</span></td>
        <td style="text-align:center">${badgeEstado(a.usada)}</td>
        <td style="white-space:nowrap">
          <div style="display:flex;gap:0.35rem">
            <button class="btn-action btn-copiar" data-url="${BASE}/entrada/${a.token}">📋 Copiar</button>
            <button class="btn-action btn-compartir-js" data-url="${BASE}/entrada/${a.token}" data-nombre="${a.nombre} ${a.apellidos}">📤 Compartir</button>
            <a href="${BASE}/entrada/${a.token}" target="_blank" class="btn-action">👁 Ver</a>
          </div>
        </td>
        <td>
          <button class="btn-borrar" data-id="${a.id}" data-nombre="${a.nombre} ${a.apellidos}"
            ${a.usada ? 'disabled title="Entrada ya usada"' : ''}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
            </svg>
          </button>
        </td>
      </tr>
    `).join('');
  }

  async function cargarAlumnos() {
    const res = await fetch('/api/alumnos');
    const alumnos = await res.json();
    renderCards(alumnos);
    renderTabla(alumnos);
    attachEventos();
  }

  function attachEventos() {
    document.querySelectorAll('.btn-borrar').forEach(btn => {
      btn.addEventListener('click', () => eliminarAlumno(btn.dataset.id, btn.dataset.nombre));
    });
    document.querySelectorAll('.btn-copiar').forEach(btn => {
      btn.addEventListener('click', () => copiarEnlace(btn.dataset.url));
    });
    document.querySelectorAll('.btn-compartir-js').forEach(btn => {
      btn.addEventListener('click', () => compartirEnlace(btn.dataset.url, btn.dataset.nombre));
    });
  }

  function copiarEnlace(url) {
    navigator.clipboard.writeText(url).then(() => toast.show());
  }

  async function compartirEnlace(url, nombre) {
    if (navigator.share) {
      try {
        await navigator.share({
          title: 'Entrada de Graduación 2026',
          text: `Aquí tienes tu entrada para la graduación de ${nombre}`,
          url
        });
      } catch (e) {
        // El usuario canceló el share sheet — no hacer nada
      }
    } else {
      copiarEnlace(url);
    }
  }

  async function eliminarAlumno(id, nombre) {
    if (!confirm(`¿Eliminar a ${nombre}?`)) return;
    const res = await fetch(`/api/alumnos/${id}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    cargarAlumnos();
  }

  function exportar() {
    fetch('/api/backup').then(r => r.blob()).then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'graduacion_backup.json'; a.click();
      URL.revokeObjectURL(url);
    });
  }

  document.getElementById('inp-importar').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!confirm(`¿Importar "${file.name}"? Reemplazará todos los datos actuales.`)) { e.target.value = ''; return; }
    try {
      const datos = JSON.parse(await file.text());
      const res = await fetch('/api/importar', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });
      const result = await res.json();
      if (result.error) { alert('Error: ' + result.error); return; }
      alert(`✓ Importados ${result.alumnos} alumnos.`);
      cargarAlumnos();
    } catch { alert('El fichero no es válido.'); }
    e.target.value = '';
  });

  cargarAlumnos();
</script>
</body>
</html>
